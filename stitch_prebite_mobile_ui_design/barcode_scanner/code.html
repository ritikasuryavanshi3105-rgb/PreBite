<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PreBite - Scan Barcode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#313030",
                        "outline-variant": "#becabc",
                        "surface-dim": "#dcd9d9",
                        "primary-fixed-dim": "#73dc8d",
                        "tertiary-fixed": "#d9e6dd",
                        "primary-fixed": "#8ff9a7",
                        "secondary": "#0f6d37",
                        "on-secondary": "#ffffff",
                        "primary": "#006b32",
                        "error": "#ba1a1a",
                        "background": "#fcf9f8",
                        "on-primary-fixed-variant": "#005225",
                        "on-primary-fixed": "#00210b",
                        "surface-bright": "#fcf9f8",
                        "inverse-on-surface": "#f3f0ef",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e5e2e1",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#1b1b1b",
                        "surface-container-highest": "#e5e2e1",
                        "surface-tint": "#006d33",
                        "on-surface-variant": "#3e4a3f",
                        "on-secondary-fixed-variant": "#005227",
                        "on-tertiary-container": "#f5fff7",
                        "surface": "#fcf9f8",
                        "secondary-fixed": "#9ff6b2",
                        "surface-container-high": "#eae7e7",
                        "on-surface": "#1b1b1b",
                        "surface-container": "#f0eded",
                        "secondary-container": "#9ff6b2",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#6b7770",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#3e4943",
                        "outline": "#6e7a6e",
                        "tertiary-fixed-dim": "#bdcac1",
                        "tertiary": "#535f58",
                        "secondary-fixed-dim": "#84d998",
                        "surface-container-low": "#f6f3f2",
                        "primary-container": "#0e8642",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#131e19",
                        "on-secondary-fixed": "#00210c",
                        "on-secondary-container": "#19733d",
                        "inverse-primary": "#73dc8d",
                        "on-error": "#ffffff",
                        "on-primary-container": "#f7fff3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "unit": "4px",
                        "margin-mobile": "16px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "40px",
                        "margin-desktop": "64px",
                        "md": "16px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "button": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "title-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "button": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .scan-line {
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
    </style>
</head>
<body class="bg-black text-white h-screen w-full flex flex-col relative overflow-hidden font-label-md">
<!-- Mock Camera Background -->
<div class="absolute inset-0 bg-cover bg-center w-full h-full opacity-60 z-0" data-alt="A blurred, dark, slightly out-of-focus close-up view of a grocery store shelf with various food products and boxes, creating a realistic mock camera preview background for a barcode scanning application. The lighting is dim but natural, emphasizing a modern tech aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC3FhQlL0BFbXzqkl1FD1WSG6XpW82gro-llrD-mbROq5mM2z9IFBAHRxR2mQ7gaHqpbj0MwR9vW8i5ET5tVBPp0rahxarVBAragplkHplSwFsuqV0wVb7Z9vy1Z-4EGvjmz1zxWkX-ZUfe-xwUzP5GwPBjrF0kNYLm1_I_wf1XQcb5jSzynv-_MOV_oLWrMyAUr4UlsjCC6XJe0vkjx8oU_gfiRv1gJz1T2GjmsqTkjNcq3kb6yxWH')"></div>
<!-- Transparent Overlay -->
<div class="absolute inset-0 bg-black/40 z-0"></div>
<!-- Top Bar -->
<div class="relative z-10 flex items-center justify-between px-margin-mobile pt-12 pb-4 w-full bg-gradient-to-b from-black/80 to-transparent">
<button class="text-white hover:opacity-80 transition-opacity p-2 active:scale-95 transition-transform rounded-full bg-black/20 backdrop-blur-md">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-white font-semibold">Scan Barcode</h1>
<button class="text-white hover:opacity-80 transition-opacity p-2 active:scale-95 transition-transform rounded-full bg-black/20 backdrop-blur-md">
<span class="material-symbols-outlined" data-icon="flash_on">flash_on</span>
</button>
</div>
<!-- Main Scanning Area -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center px-margin-mobile -mt-12">
<!-- Scanning Frame -->
<div class="relative w-64 h-64 sm:w-72 sm:h-72 mb-lg">
<!-- Frame Corners (Primary Green #006b32 used from config) -->
<div class="absolute top-0 left-0 w-8 h-8 border-t-4 border-l-4 border-primary rounded-tl-xl"></div>
<div class="absolute top-0 right-0 w-8 h-8 border-t-4 border-r-4 border-primary rounded-tr-xl"></div>
<div class="absolute bottom-0 left-0 w-8 h-8 border-b-4 border-l-4 border-primary rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 w-8 h-8 border-b-4 border-r-4 border-primary rounded-br-xl"></div>
<!-- Clear Center Area -->
<div class="absolute inset-2 bg-transparent rounded-lg shadow-[0_0_0_9999px_rgba(0,0,0,0.6)] border-2 border-white/20"></div>
<!-- Active Scanning Line -->
<div class="absolute left-2 right-2 h-1 bg-primary shadow-[0_0_8px_rgba(0,107,50,0.8)] scan-line z-20 rounded-full"></div>
</div>
<!-- Instructions -->
<div class="text-center max-w-[280px]">
<h2 class="font-title-lg text-title-lg text-white mb-sm">Scan the barcode on the product</h2>
<p class="font-body-md text-body-md text-white/70">Hold your phone steady and position the barcode inside the frame.</p>
</div>
</div>
<!-- Bottom Controls Area -->
<div class="relative z-10 pb-12 pt-6 w-full flex flex-col items-center bg-gradient-to-t from-black/90 via-black/60 to-transparent">
<!-- Action Row -->
<div class="flex items-center justify-around w-full px-margin-mobile max-w-sm mb-lg">
<!-- Gallery -->
<button class="flex flex-col items-center gap-2 text-white/90 hover:text-white transition-colors active:scale-95">
<div class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center border border-white/20">
<span class="material-symbols-outlined" data-icon="image">image</span>
</div>
<span class="font-label-md text-label-md">Gallery</span>
</button>
<!-- Main Scan Button -->
<button class="relative flex items-center justify-center w-20 h-20 rounded-full bg-primary text-white shadow-[0_4px_24px_rgba(0,107,50,0.4)] hover:bg-primary/90 transition-colors active:scale-90 border-4 border-black/20">
<span class="material-symbols-outlined text-[32px]" data-icon="barcode_scanner" data-weight="fill" style="font-variation-settings: 'FILL' 1;">barcode_scanner</span>
</button>
<!-- Light -->
<button class="flex flex-col items-center gap-2 text-white/90 hover:text-white transition-colors active:scale-95">
<div class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center border border-white/20">
<span class="material-symbols-outlined" data-icon="flashlight_on">flashlight_on</span>
</div>
<span class="font-label-md text-label-md">Light</span>
</button>
</div>
<!-- Helper Message -->
<p class="font-label-md text-label-md text-white/50 text-center">Make sure the barcode is clearly visible</p>
</div>
</body></html>
